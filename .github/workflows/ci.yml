name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lightflow
          POSTGRES_PASSWORD: lightflow
          POSTGRES_DB: lightflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lightflow"
          --health-interval 5s --health-timeout 5s --health-retries 10

    strategy:
      matrix:
        node: [20, 22]

    env:
      LIGHTFLOW_PG_URL: postgres://lightflow:lightflow@localhost:5432/lightflow_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run build
      - run: npm test
